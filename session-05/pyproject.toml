[tool.poetry]
name = "edustream-agentic-pipeline"
version = "1.0.0"
description = "EduStream Agentic Medallion Data Platform — LangGraph + MCP + Databricks"
authors = ["Manuel Coy <mcoy@mcoyai.com>"]

[tool.poetry.dependencies]
python = "^3.11"
langgraph = "^0.2.28"
langchain-anthropic = "^0.2.4"
anthropic = "^0.37.0"
databricks-sdk = "^0.32.0"
great-expectations = "^1.2.0"
dbt-databricks = "^1.8.0"
mlflow = "^2.16.0"
logfire = "^0.50.0"
opentelemetry-sdk = "^1.27.0"
pyspark = "^3.5.0"
delta-spark = "^3.2.0"
pandas = "^2.2.0"
pydantic = "^2.9.0"
httpx = "^0.27.0"

[tool.poetry.dev-dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
